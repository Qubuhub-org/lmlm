name: LMLM CI

on:
  pull_request:
  push:
    branches: ["main", "audit/remediation-2026-10"]

permissions:
  contents: read

jobs:
  python-core:
    name: Native LMLM core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile core and tests
        run: python -m compileall -q lmlm_core tests
      - name: Run dependency-free core tests
        run: python -m unittest discover -s tests -v

  python-neural-smoke:
    name: Native LMLM CPU training and inference smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Install LMLM core
        run: python -m pip install --no-deps .
      - name: Run tests with neural backend enabled
        run: python -m unittest discover -s tests -v
      - name: Create local smoke corpus
        run: python -c "from pathlib import Path; Path('/tmp/lmlm-corpus.txt').write_text('LMLM is a local model. ' * 40, encoding='utf-8')"
      - name: Train byte-tokenized model
        run: python -m lmlm_core train /tmp/lmlm-corpus.txt --output /tmp/lmlm-byte.pt --steps 2 --batch-size 2 --context-length 8 --hidden-size 16 --layers 1 --heads 4
      - name: Reload byte checkpoint and generate
        run: python -m lmlm_core generate /tmp/lmlm-byte.pt "LMLM" --max-new-tokens 2 --top-k 8
      - name: Train BPE-tokenized model
        run: python -m lmlm_core train /tmp/lmlm-corpus.txt --output /tmp/lmlm-bpe.pt --steps 2 --batch-size 2 --context-length 8 --hidden-size 16 --layers 1 --heads 4 --tokenizer bpe --vocab-size 280 --min-frequency 2
      - name: Reload BPE checkpoint and generate
        run: python -m lmlm_core generate /tmp/lmlm-bpe.pt "LMLM" --max-new-tokens 2 --top-k 8

  node-api:
    name: Node API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Build container image
        run: docker build --tag lmlm-api:test .
