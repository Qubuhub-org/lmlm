name: LMLM CI

on:
  pull_request:
  push:
    branches: ["main", "audit/remediation-2026-10"]

permissions:
  contents: read

jobs:
  python-core:
    name: Native LMLM core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile core and tests
        run: python -m compileall -q lmlm_core tests
      - name: Run dependency-free core tests
        run: python -m unittest discover -s tests -v

  python-neural-smoke:
    name: Native LMLM CPU training, inference, and repository-docs benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Install LMLM core
        run: python -m pip install --no-deps .
      - name: Run tests with neural backend enabled
        run: python -m unittest discover -s tests -v
      - name: Create local smoke corpus
        run: python -c "from pathlib import Path; Path('/tmp/lmlm-corpus.txt').write_text('LMLM is a local model. ' * 40, encoding='utf-8')"
      - name: Train byte-tokenized model
        run: python -m lmlm_core train /tmp/lmlm-corpus.txt --output /tmp/lmlm-byte.pt --steps 2 --batch-size 2 --context-length 8 --hidden-size 16 --layers 1 --heads 4
      - name: Reload byte checkpoint and generate
        run: python -m lmlm_core generate /tmp/lmlm-byte.pt "LMLM" --max-new-tokens 2 --top-k 8
      - name: Train BPE-tokenized model
        run: python -m lmlm_core train /tmp/lmlm-corpus.txt --output /tmp/lmlm-bpe.pt --steps 2 --batch-size 2 --context-length 8 --hidden-size 16 --layers 1 --heads 4 --tokenizer bpe --vocab-size 280 --min-frequency 2
      - name: Reload BPE checkpoint and generate
        run: python -m lmlm_core generate /tmp/lmlm-bpe.pt "LMLM" --max-new-tokens 2 --top-k 8
      - name: Assemble repository documentation corpus
        run: cat README.md docs/RECONSTRUCTION_STATUS.md project.md > /tmp/lmlm-repository-docs.txt
      - name: Run byte/BPE benchmark on repository documentation
        run: >-
          python -m lmlm_core benchmark /tmp/lmlm-repository-docs.txt
          --output-dir artifacts/repository-docs-baseline
          --steps 30 --batch-size 4 --eval-every 10
          --seed 17 --context-length 64 --hidden-size 32
          --layers 1 --heads 4 --device cpu
          --vocab-size 320 --min-frequency 2
      - name: Print benchmark metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/repository-docs-baseline/benchmark.json").read_text())
          print("Corpus:", report["source_name"])
          print("SHA-256:", report["source_sha256"])
          print("Split characters:", {k: v["characters"] for k, v in report["splits"]["splits"].items()})
          for name, result in report["runs"].items():
              print(f"[{name}] vocab={result['vocab_size']} steps={result['steps']}")
              for split in ("validation", "test"):
                  m = result[split]
                  print(f"  {split}: loss={m['loss']:.6f} perplexity={m['perplexity']:.6f} bits_per_byte={m['bits_per_byte']:.6f}")
          PY
      - name: Upload benchmark report and checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: lmlm-repository-docs-baseline
          path: artifacts/repository-docs-baseline/
          if-no-files-found: error

  node-api:
    name: Node API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Build container image
        run: docker build --tag lmlm-api:test .
