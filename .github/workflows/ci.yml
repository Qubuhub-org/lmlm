name: LMLM CI

on:
  pull_request:
  push:
    branches: ["main", "audit/remediation-2026-10"]

permissions:
  contents: read

jobs:
  python-core:
    name: Native LMLM core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile core and tests
        run: python -m compileall -q lmlm_core tests
      - name: Run dependency-free core tests
        run: python -m unittest discover -s tests -v

  node-api:
    name: Node API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Build container image
        run: docker build --tag lmlm-api:test .
