name: Validate documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/build-doc.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/build-doc.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate static documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require documentation entry point
        run: test -s docs/index.html
      - name: Require source documentation
        run: test -s docs/indexcontent.md
