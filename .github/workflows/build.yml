name: Deploy LMLM documentation to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify documentation entry point
        run: test -s docs/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload reviewed documentation only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
