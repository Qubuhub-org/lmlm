[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmlm-core"
version = "0.1.0"
description = "A local-first, in-built language-model runtime for LMLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Seriki Walter Yakub" }]
dependencies = []

[project.optional-dependencies]
runtime = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
lmlm = "lmlm_core.__main__:main"

[tool.setuptools.packages.find]
include = ["lmlm_core*"]
